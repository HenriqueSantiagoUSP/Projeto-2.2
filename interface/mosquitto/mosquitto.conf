# Broker of the central (docs/protocolo.md §1).
# Anonymous access is off: entrypoint.sh writes the password file from .env before
# starting, and acl says which user may read and write which topics.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

per_listener_settings false
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# MQTT: hubs, the simulator, Telegraf and the notifier.
listener 1883
protocol mqtt

# MQTT over WebSocket: tools running in a browser.
listener 9001
protocol websockets

# TLS, once the broker leaves the local network (cloud bridge, docs/roadmap.md):
# listener 8883
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
