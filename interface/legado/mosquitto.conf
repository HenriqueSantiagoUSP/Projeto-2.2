# =============================================================================
#  mosquitto.conf — Broker MQTT do protótipo "Monitoramento de Idosos"
#  Escola Politécnica da USP — Interface Aberta de Dados (Q1) e Rede Sem Fio (Q3)
# =============================================================================
#
#  Papel do broker (relatório, §5.1): ponto central de roteamento. Os clientes
#  nunca falam entre si — o hub do quarto (ESP32-S3) PUBLICA, o dashboard
#  ASSINA, e o Mosquitto entrega cada mensagem a quem estiver inscrito no tópico.
#
#  Este arquivo abre DOIS "ouvidos" (listeners) no mesmo broker:
#
#     ESP32-S3 (hub)  ──MQTT/TCP──▶  :1883  ┐
#                                           ├─ Mosquitto ─▶ roteia por tópico
#     Navegador       ◀─MQTT/WS───  :9001  ┘
#
#  Como executar (detalhes no README.md):
#     mosquitto -c mosquitto.conf
#
#  Sintaxe: uma diretiva por linha ("chave valor"); linhas com # são comentários.
#  As diretivas de um listener (ex.: protocol) valem para o listener declarado
#  imediatamente ACIMA delas — portanto a ordem das linhas importa.
# =============================================================================

# -----------------------------------------------------------------------------
# 1) Listener MQTT "clássico" — porta 1883 (TCP puro)
# -----------------------------------------------------------------------------
# É aqui que o hub do quarto se conecta (Listagem 3 do relatório:
# broker.address.uri = "mqtt://192.168.0.10:1883"). Sem bind_address o broker
# escuta em TODAS as interfaces de rede, o que é necessário para o ESP32
# alcançar o PC pela rede Wi-Fi.
listener 1883
protocol mqtt

# -----------------------------------------------------------------------------
# 2) Listener MQTT sobre WebSockets — porta 9001
# -----------------------------------------------------------------------------
# Navegadores não abrem sockets TCP "crus": eles falam WebSocket. O Mosquitto
# encapsula os pacotes MQTT em quadros WebSocket (relatório, §4.6) e a
# biblioteca MQTT.js do dashboard conecta em ws://<host>:9001.
listener 9001
protocol websockets

# -----------------------------------------------------------------------------
# 3) Autenticação — desativada nesta etapa (protótipo acadêmico local)
# -----------------------------------------------------------------------------
# Desde o Mosquitto 2.0 o padrão é allow_anonymous false: um cliente sem
# usuário/senha é RECUSADO (CONNACK "not authorised"). Como o ESP32 e o
# dashboard ainda não enviam credenciais, liberamos conexões anônimas.
# A diretiva vale para todos os listeners declarados acima.
allow_anonymous true

# -----------------------------------------------------------------------------
# 4) Persistência — desativada
# -----------------------------------------------------------------------------
# Mensagens retidas (flag retain, relatório §4.7) e sessões ficam apenas em
# memória enquanto o broker roda. Para o protótipo isso basta e evita ter de
# configurar um diretório gravável (persistence_location) no Windows.
persistence false

# -----------------------------------------------------------------------------
# 5) Logs — verbosos, para acompanhar a demonstração no terminal
# -----------------------------------------------------------------------------
# Com estes tipos de log, cada CONNECT/DISCONNECT, cada SUBSCRIBE e cada
# cliente novo aparece no console: útil para mostrar ao vivo o fluxo
# publicação/assinatura descrito no relatório (§4.2).
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# =============================================================================
#  PRÓXIMA ETAPA (não ativada): autenticação e criptografia (relatório §4.5)
# =============================================================================
# 1. Criar o arquivo de senhas:   mosquitto_passwd -c senhas.txt hub_quarto
# 2. Exigir credenciais (substitui o allow_anonymous true acima):
#allow_anonymous false
#password_file senhas.txt
#
# 3. MQTT sobre TLS na porta 8883 (exige certificados):
#listener 8883
#protocol mqtt
#cafile   certs/ca.crt
#certfile certs/servidor.crt
#keyfile  certs/servidor.key
