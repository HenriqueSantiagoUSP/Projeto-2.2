# Copies every MQTT message of the system into InfluxDB, with no code
# (docs/protocolo.md §1). Topic levels become tags (site, quarto, id) and the JSON
# keys become fields; nested "detalhe" keys arrive as detalhe_<key>.
#
# The time of a point is when Telegraf received it. The hub's "ts" is kept as a
# field: it is missing until the hub has a clock, and a point without its time
# key would otherwise be dropped.

[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

# Four levels: idoso/<site>/<quarto>/<assunto>
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = [
    "idoso/+/+/status",
    "idoso/+/+/presenca",
    "idoso/+/+/temperatura",
    "idoso/+/+/alerta",
  ]
  client_id = "telegraf-assuntos"
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  qos = 1
  persistent_session = true
  data_format = "json"
  # Booleans ("hora") are dropped by this parser unless listed here; they arrive as "true"/"false".
  json_string_fields = ["estado", "sensor", "fw", "hora", "id", "tipo", "origem", "detalhe_porta", "detalhe_pulseira", "detalhe_via"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "idoso/+/+/+"
    measurement = "_/_/_/measurement"
    tags = "_/site/quarto/_"

# Five levels: idoso/<site>/<quarto>/porta/<id> and idoso/<site>/<quarto>/pulseira/<id>
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = [
    "idoso/+/+/porta/+",
    "idoso/+/+/pulseira/+",
  ]
  client_id = "telegraf-ids"
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  qos = 1
  persistent_session = true
  data_format = "json"
  json_string_fields = ["estado", "sensor"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "idoso/+/+/+/+"
    measurement = "_/_/_/measurement/_"
    tags = "_/site/quarto/_/id"

# Six levels, published by the wearable itself when its optional MQTT link is on:
# idoso/<site>/<quarto>/pulseira/<id>/telemetria and .../pulseira/<id>/mqtt.
# One consumer each, to give the measurements names of their own.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["idoso/+/+/pulseira/+/telemetria"]
  client_id = "telegraf-pulseira-telemetria"
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  qos = 0
  data_format = "json"
  json_string_fields = ["hub"]
  name_override = "pulseira_telemetria"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "idoso/+/+/pulseira/+/telemetria"
    tags = "_/site/quarto/_/id/_"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["idoso/+/+/pulseira/+/mqtt"]
  client_id = "telegraf-pulseira-mqtt"
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  qos = 1
  persistent_session = true
  data_format = "json"
  json_string_fields = ["estado", "fw"]
  name_override = "pulseira_mqtt"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "idoso/+/+/pulseira/+/mqtt"
    tags = "_/site/quarto/_/id/_"
