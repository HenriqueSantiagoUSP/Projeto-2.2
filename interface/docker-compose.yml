# Central of the monitoring system (docs/arquitetura.md, section Central):
# broker, history, dashboards and Telegram notifications.
#
#   copy .env.example .env      (then change the passwords)
#   docker compose up -d
#
# Everything is configured by the files in this folder; secrets come from .env.
name: monitoramento-idosos

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT: hubs and the simulator
      - "9001:9001"   # MQTT over WebSocket: browser tools
    environment:
      MQTT_HUB_PASSWORD: ${MQTT_HUB_PASSWORD:?set it in .env}
      MQTT_VESTIVEL_PASSWORD: ${MQTT_VESTIVEL_PASSWORD:?set it in .env}
      MQTT_TELEGRAF_PASSWORD: ${MQTT_TELEGRAF_PASSWORD:?set it in .env}
      MQTT_NOTIFICADOR_PASSWORD: ${MQTT_NOTIFICADOR_PASSWORD:?set it in .env}
      MQTT_PAINEL_PASSWORD: ${MQTT_PAINEL_PASSWORD:?set it in .env}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/entrypoint.sh:/central-entrypoint.sh:ro
      - mosquitto-data:/mosquitto/data
    entrypoint: ["/bin/sh", "/central-entrypoint.sh"]

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:?set it in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-ilpi}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-monitoramento}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?set it in .env}
    volumes:
      - influxdb-data:/var/lib/influxdb2

  telegraf:
    image: telegraf:1.32
    restart: unless-stopped
    depends_on: [mosquitto, influxdb]
    environment:
      MQTT_TELEGRAF_PASSWORD: ${MQTT_TELEGRAF_PASSWORD}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG:-ilpi}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-monitoramento}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    depends_on: [influxdb]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set it in .env}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/quartos.json
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG:-ilpi}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-monitoramento}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  notificador:
    build: ./notificador
    restart: unless-stopped
    depends_on: [mosquitto]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PASSWORD: ${MQTT_NOTIFICADOR_PASSWORD}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

volumes:
  mosquitto-data:
  influxdb-data:
  grafana-data:
